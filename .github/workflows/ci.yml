name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.7-bookworm
        env:
          POSTGRES_USER: offscroll_ci
          POSTGRES_DB: offscroll_ci
          # Public placeholder for this disposable CI database, not a stored secret.
          POSTGRES_PASSWORD: ci_placeholder_password
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U offscroll_ci -d offscroll_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Install
        run: |
          make venv
          make install
      - name: Lint, typecheck, and unit tests
        run: make check
      - name: Scan reachable Git history for secret patterns
        run: make secrets
      - name: Apply migrations and run integration test
        env:
          DATABASE_URL: postgresql+psycopg://offscroll_ci:ci_placeholder_password@127.0.0.1:5432/offscroll_ci
        run: |
          make migrate
          make test-integration

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install test tools
        run: |
          make venv
          make install
          npm ci
          npx playwright install --with-deps chromium
      - name: Check frontend and offline desktop/mobile behavior
        run: |
          npm run check:frontend
          npm test
