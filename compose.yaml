services:
  postgres:
    image: postgres:18.7-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Export POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Export POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Export POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    profiles: [app]
    build: .
    environment:
      DATABASE_URL: ${APP_DATABASE_URL:-}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

volumes:
  postgres_data:
