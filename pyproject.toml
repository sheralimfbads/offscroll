[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "offscroll"
version = "0.1.0"
description = "A small metadata pipeline for weekly curated digests."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "httpx>=0.27,<1",
    "python-dotenv>=1,<2",
    "pydantic-settings>=2.7,<3",  # Validate environment settings and mask secret values.
    "SQLAlchemy>=2.0,<3",  # Manage database engines and sessions with the 2.x API.
    "psycopg[binary]>=3.2,<4",  # Connect to PostgreSQL without a local compiler setup.
    "alembic>=1.14,<2",  # Version and apply database schema migrations.
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9,<1",  # Linting, import ordering, and formatting during development.
    "mypy>=1.14,<2",  # Static type checking for the Python package.
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a PostgreSQL database with migrations applied"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.14"
files = ["src"]
strict = true
plugins = ["pydantic.mypy"]
