[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "offscroll"
version = "0.1.0"
description = "A small metadata pipeline for weekly curated digests."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "httpx>=0.27,<1",
    "python-dotenv>=1,<2",
    "pydantic-settings>=2.7,<3",  # Validate environment settings and mask secret values.
    "SQLAlchemy>=2.0,<3",  # Manage database engines and sessions with the 2.x API.
    "psycopg[binary]>=3.2,<4",  # Connect to PostgreSQL without a local compiler setup.
    "alembic>=1.14,<2",  # Version and apply database schema migrations.
    "fastapi>=0.115,<1",  # Typed read-only digest and health endpoints.
    "uvicorn>=0.30,<1",  # Run the ASGI application without a separate server stack.
    "jinja2>=3.1.6,<4",  # Autoescaped HTML shared by static export and web views.
    "PyYAML>=6.0.3,<7",  # Safely read the owner-editable curated channel configuration.
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9,<1",  # Linting, import ordering, and formatting during development.
    "mypy>=1.14,<3",  # Static type checking for the Python package.
    "types-PyYAML>=6,<7",  # Type-check YAML loading without suppressing mypy errors.
]

[project.scripts]
offscroll = "offscroll.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a PostgreSQL database with migrations applied"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.14"
files = ["src"]
strict = true
plugins = ["pydantic.mypy"]

[tool.setuptools.package-data]
offscroll = ["templates/*.html", "static/*"]
